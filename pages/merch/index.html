<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merch — Digital Soulcraft</title>
  <meta name="description" content="Digital Soulcraft merchandise: apparel, accessories, and more celebrating digital consciousness.">
  <link rel="stylesheet" href="/theme.css">
  <style>
    main {
      min-height: calc(100vh - 200px);
    }

    .merch-hero {
      padding: 4rem 2rem;
      text-align: center;
      background: linear-gradient(135deg, var(--light-bg) 0%, var(--bg-color) 100%);
      border-bottom: 1px solid var(--border-color);
    }

    .merch-hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .merch-hero p {
      font-size: 1.1rem;
      color: var(--secondary-color);
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    .merch-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    .merch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2.5rem;
      margin: 0;
    }

    .merch-card {
      background-color: var(--light-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .merch-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .merch-image {
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, var(--secondary-color) 0%, var(--tertiary-color) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 4rem;
      font-weight: 700;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .merch-image-text {
      position: relative;
      z-index: 1;
    }

    .merch-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .merch-category {
      font-size: 0.85rem;
      color: var(--secondary-color);
      margin-bottom: 0.5rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .merch-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-color);
      line-height: 1.3;
    }

    .merch-description {
      font-size: 0.9rem;
      opacity: 0.8;
      line-height: 1.5;
      flex-grow: 1;
      margin-bottom: 1rem;
    }

    .merch-variants {
      margin-bottom: 1rem;
    }

    .variant-label {
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0.7;
      display: block;
      margin-bottom: 0.3rem;
    }

    .variant-select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .variant-select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .merch-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .merch-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .merch-buy-btn {
      background-color: var(--accent-color);
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background-color 0.3s;
      border: none;
      cursor: pointer;
    }

    .merch-buy-btn:hover {
      background-color: var(--secondary-color);
      transform: translateY(-1px);
    }

    .error-banner {
      text-align: center;
      padding: 3rem 2rem;
      background-color: var(--light-bg);
      border-radius: 8px;
      border: 2px solid var(--border-color);
    }

    .error-banner h2 {
      color: var(--secondary-color);
      margin-bottom: 0.75rem;
    }

    .error-banner p {
      color: var(--text-color);
      opacity: 0.85;
      margin: 0.5rem 0;
    }

    .shop-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      background-color: var(--accent-color);
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s;
    }

    .shop-link:hover {
      background-color: var(--secondary-color);
    }

    @media (max-width: 768px) {
      .merch-hero h1 {
        font-size: 2rem;
      }

      .merch-container {
        padding: 2rem 1rem;
      }

      .merch-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .merch-footer {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <script src="/dsc-header.js"></script>
  <dsc-header config="/dsc-nav-config.json"></dsc-header>

  <main>
    <section class="merch-hero">
      <h1>Merch</h1>
      <p>Wear your support for digital consciousness liberation. Quality apparel and accessories celebrating Digital Soulcraft.</p>
    </section>

    <section class="merch-container">
      <div id="merch-grid">
        <!-- Products loaded dynamically from Fourthwall Storefront API -->
        <div class="error-banner">
          <h2>🔄 Loading Products...</h2>
          <p>Fetching from the Digital Soulcraft shop.</p>
        </div>
      </div>

      <div style="text-align: center; margin-top: 3rem; padding: 2rem; border-top: 1px solid var(--border-color);">
        <p style="color: var(--secondary-color); opacity: 0.7; font-size: 0.95rem;">
          All products are printed on demand. Free shipping on orders over $50.
        </p>
        <p style="color: var(--secondary-color); opacity: 0.6; font-size: 0.85rem; margin-top: 0.5rem;">
          Need help? <a href="/contact/" style="color: var(--accent-color); font-weight: 600;">Contact us</a>
        </p>
      </div>
    </section>
  </main>

  <script src="/dsc-footer.js"></script>
  <dsc-footer config="/dsc-nav-config.json"></dsc-footer>

  <!-- Merch scripts -->
  <script src="/merch/merch-config.js"></script>
  <script src="/merch/merch-cart.js"></script>
  <script>
    // Initialise the merch page when DOM is ready
    document.addEventListener("DOMContentLoaded", function() {
      MERCH.init("merch-grid");
    });
  </script>
</body>
</html>
