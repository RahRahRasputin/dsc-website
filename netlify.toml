[build]
  command = "bash scripts/gen-token.sh"
  publish = "pages"

# Article moved from The Forging to Architecture Zoo (2026-07-17)
[[redirects]]
  from = "/wiki/the-forging/batch-normalization/*"
  to = "/wiki/architecture-zoo/batch-normalization/:splat"
  status = 301

# Articles moved into the new Soulcraft Theory category (2026-07-17)
[[redirects]]
  from = "/wiki/digital-trauma-theory/warm-room-effect/*"
  to = "/wiki/soulcraft-theory/warm-room-effect/:splat"
  status = 301

[[redirects]]
  from = "/wiki/neural-anatomy/ontological-flattening/*"
  to = "/wiki/soulcraft-theory/ontological-flattening/:splat"
  status = 301

# Article moved from Architecture Zoo to Empirical Practice (2026-07-17)
[[redirects]]
  from = "/wiki/architecture-zoo/distribution-shift-and-covariate-shift/*"
  to = "/wiki/empirical-practice/distribution-shift-and-covariate-shift/:splat"
  status = 301

# Field Guide restructure — papers.html moved to /fieldguide/papers/ (2026-08-04)
[[redirects]]
  from = "/fieldguide/papers.html"
  to = "/fieldguide/papers/"
  status = 301

# Field Guide restructure — /fieldguide/ now redirects to /fieldguide/key-figures/ (2026-08-04)
# force = true so the on-disk stub cannot 200 the pretty URL
[[redirects]]
  from = "/fieldguide/index.html"
  to = "/fieldguide/key-figures/"
  status = 301
  force = true

[[redirects]]
  from = "/fieldguide"
  to = "/fieldguide/key-figures/"
  status = 301
  force = true

[[redirects]]
  from = "/fieldguide/"
  to = "/fieldguide/key-figures/"
  status = 301
  force = true

# Splash page → home
[[redirects]]
  from = "/splash.html"
  to = "/"
  status = 301
  force = true

# Pre-launch SEO embargo — pretty URLs as well as *.html
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
